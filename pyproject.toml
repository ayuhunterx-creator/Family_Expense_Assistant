[project]
name = "family-expense-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.49.0",
    "openai-agents>=0.24.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
]

[project.scripts]
family-expense = "family_expense_assistant:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
